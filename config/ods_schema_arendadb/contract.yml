# $schema: ../schema_ods_table.json
schedule_cron: '12 0 * * *'
enabled_flag: true

source:
  connector_name: 'arendadb'
  connector_table_schema: 'public'
  connector_table_name: 'contract'
  connector_read_parallel_number: 1

capture:
  data_capture_type: incremental
  pattern_capture: null
  hard_delete_source_flag: false
  soft_delete_clause_trino: |-
    status = 'deleted' 
  where_clause_trino: |-
    deleted_flag = true
  watermark_clause_trino: |-
    updated_at  >= from_iso8601_timestamp( '{{wm_min_timestamp}}')
  order_latest_clause_trino: null
  cross_join_lateral_selects_trino: null

watermark:
  select_wm_max_timestamp_sql: |-
    <default>
  select_wm_min_timestamp_sql: |-
    <default>
  select_wm_max_id_sql: |-
    <default>
  select_wm_min_id_sql: |-
    <default>
  select_wm_target_timestamp_sql: |-
    select max(updated_at) as wm_target_timestamp from {{var.value.ahd_iceberg_catalog_name}}.stage_schema.{{connector_name}}__{{ods_table_name}}  
  select_wm_target_id_sql: |-
    select null

table:
  comment: ''
  partitions_count: 1
  export_ahd_gp: latest

